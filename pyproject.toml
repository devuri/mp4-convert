[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mp3tomp4"
version = "1.0.0"
description = "Batch-convert audio files into MP4 videos with a static background."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["ffmpeg", "mp3", "mp4", "audio", "video", "conversion", "podcast"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/OWNER/mp3-to-mp4"
Issues = "https://github.com/OWNER/mp3-to-mp4/issues"
Changelog = "https://github.com/OWNER/mp3-to-mp4/blob/main/CHANGELOG.md"

[project.scripts]
mp3tomp4 = "mp3tomp4.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/mp3tomp4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
